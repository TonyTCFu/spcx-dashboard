name: Daily SpaceX Metrics Auto-Update

on:
  schedule:
    # Trigger every day at 05:00 UTC (13:00 Beijing Time, after US market closes)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Script
        run: |
          python update_dashboard_data.py

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name 'SpaceX Auto-Bot'
          git config --global user.email 'bot@spacex-monitor.internal'
          git add data/metrics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: daily metrics cache update [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" && git push)
